apis:
- aid: weidmueller:u-os-data-hub-variable-nats-api
  name: Weidmüller u-OS Data Hub Variable-NATS API
  description: >-
    A fast asynchronous, event-based NATS API for providing and consuming variables within the u-OS Data
    Hub; not accessible to clients outside the device (AsyncAPI 2.6.0, 10 channels, NATS server at 127.0.0.1:49360
    on the device).
  humanURL: https://support.weidmueller.com/online-documentation/latest/312416/en-GB/142279051.html
  tags:
  - Data Hub
  - NATS
  - Event-Driven
  - u-OS
  properties:
  - type: AsyncAPI
    url: asyncapi/weidmueller-variable-nats-asyncapi.yml
  - type: AsyncAPI
    name: AsyncAPI (provider-hosted)
    url: >-
      https://raw.githubusercontent.com/weidmueller/u-os-hub-api/main/variable-nats-api/variable-nats-asyncapi.yaml
